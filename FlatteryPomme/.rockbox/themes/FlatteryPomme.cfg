# Official Chicago 12 CJK glyphs in an 18 px cell for six full menu rows.
font: /.rockbox/fonts/18-ChicagoCJK12.fnt
wps: /.rockbox/wps/FlatteryPomme.wps
sbs: /.rockbox/wps/FlatteryPomme.sbs
# Blank icon slots reserve a small left margin without displaying icons.
iconset: /.rockbox/icons/flatterypomme_menupadding.bmp
viewers iconset: -
show icons: on
backdrop: -
selector type: bar (inverse)
statusbar: top
scrollbar: right
scrollbar width: 8 
ui viewport: -

volume display: graphic
battery display: graphic
